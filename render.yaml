# Render blueprint for the MindMesh API (with its background worker running inside it).
# Render dashboard → New → Blueprint → pick this repository. Free plan: no card needed.
# Values marked `sync: false` are asked for when you create the blueprint; see docs/deploy.md.
services:
  - type: web
    name: mindmesh-api
    runtime: node
    plan: free
    # Pick the region closest to your MongoDB Atlas cluster (oregon, ohio, virginia, frankfurt, singapore).
    region: singapore
    branch: main
    # No TypeScript compile here: tsc needs ~430 MB, more than Render's free build machine gives
    # it, so the server runs the TypeScript source through tsx (types are checked in CI instead).
    # Dev dependencies include tsx. The model is downloaded now so the server doesn't fetch it
    # again each time it wakes up.
    buildCommand: unset NODE_OPTIONS && npm ci --include=dev && npm run prefetch-model -w apps/api
    # The free plan has 512 MB; the API with the model in memory peaks around 240 MB.
    startCommand: node --max-old-space-size=320 --import tsx apps/api/src/index.ts
    healthCheckPath: /ready
    # Deploys are started by .github/workflows/deploy.yml (a deploy hook), only after a PR is merged
    # into main and its tests pass, so Render doesn't also deploy on every push.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Free Render has no background workers, so the worker loop runs inside the API.
      - key: RUN_WORKER
        value: inline
      # One proxy (Render's) sits in front of the API.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_FORMAT
        value: json
      - key: EMBEDDING_PROVIDER
        value: local
      - key: VECTOR_BACKEND
        value: auto
      - key: ANSWER_PROVIDER
        value: quotes
      # Secrets and per-deployment values: entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # The Firebase Hosting address of the web app, e.g. https://your-project.web.app
      - key: CLIENT_ORIGIN
        sync: false
